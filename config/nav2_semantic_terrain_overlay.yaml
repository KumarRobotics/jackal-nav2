# Opt-in overrides layered on top of the normal Jackal Nav2 parameter file by
# jackal_navigation.launch.py when semantic_navigation:=true.

bt_navigator:
  ros__parameters:
    # Filled by nav2_servers.launch.py with Nav2's periodic 1 Hz replanning tree.
    default_nav_to_pose_bt_xml: "__NAV_TO_POSE_BT_XML__"

controller_server:
  ros__parameters:
    FollowPath:
      # Conservative limit for the first physical semantic-navigation trials.
      vx_max: 0.3
      vx_min: -0.3

velocity_smoother:
  ros__parameters:
    # Keep the hardware-facing limit consistent with MPPI's model.
    max_velocity: [0.3, 0.0, 0.6]
    min_velocity: [-0.3, 0.0, -0.6]

local_costmap:
  local_costmap:
    ros__parameters:
      # Geometry remains authoritative. Semantics can only add cost, and the
      # resulting field is inflated for footprint-aware local control.
      plugins: ["voxel_layer", "semantic_layer", "inflation_layer"]
      semantic_layer:
        plugin: "semantic_segmentation_layer::SemanticSegmentationLayer"
        enabled: true
        combination_method: 1
        use_approximate_time_sync: true
        sensor_data_depth: 5
        observation_sources: "zed_semantics"
        zed_semantics:
          segmentation_topic: "semantic_terrain/label_mask"
          confidence_topic: "semantic_terrain/confidence"
          labels_topic: "semantic_terrain/label_info"
          pointcloud_topic: "semantic_terrain/points"
          observation_persistence: 0.0
          expected_update_rate: 0.0
          max_obstacle_distance: 8.0
          min_obstacle_distance: 0.5
          tile_map_decay_time: 3.0
          visualize_tile_map: false
          use_cost_selection: true
          class_types:
            - preferred_surface
            - caution_surface
            - high_risk_surface
            - water_or_dropoff
          preferred_surface:
            classes: ["preferred_surface"]
            base_cost: 0
            max_cost: 0
            mark_confidence: 153
            samples_to_max_cost: 2
            dominant_priority: false
          caution_surface:
            classes: ["caution_surface"]
            base_cost: 60
            max_cost: 100
            mark_confidence: 153
            samples_to_max_cost: 2
            dominant_priority: false
          high_risk_surface:
            classes: ["high_risk_surface"]
            base_cost: 150
            max_cost: 220
            mark_confidence: 153
            samples_to_max_cost: 2
            dominant_priority: true
          water_or_dropoff:
            classes: ["water_or_dropoff"]
            base_cost: 200
            # Semantic output is deliberately non-lethal. Only geometric
            # obstacle layers may produce Nav2's lethal cost (254).
            max_cost: 252
            mark_confidence: 153
            samples_to_max_cost: 2
            dominant_priority: true

global_costmap:
  global_costmap:
    ros__parameters:
      plugins: ["voxel_layer", "semantic_layer", "inflation_layer"]
      semantic_layer:
        plugin: "semantic_segmentation_layer::SemanticSegmentationLayer"
        enabled: true
        combination_method: 1
        use_approximate_time_sync: true
        sensor_data_depth: 5
        observation_sources: "zed_semantics"
        zed_semantics:
          segmentation_topic: "semantic_terrain/label_mask"
          confidence_topic: "semantic_terrain/confidence"
          labels_topic: "semantic_terrain/label_info"
          pointcloud_topic: "semantic_terrain/points"
          observation_persistence: 0.0
          expected_update_rate: 0.0
          max_obstacle_distance: 8.0
          min_obstacle_distance: 0.5
          tile_map_decay_time: 3.0
          visualize_tile_map: false
          use_cost_selection: true
          class_types:
            - preferred_surface
            - caution_surface
            - high_risk_surface
            - water_or_dropoff
          preferred_surface:
            classes: ["preferred_surface"]
            base_cost: 0
            max_cost: 0
            mark_confidence: 153
            samples_to_max_cost: 2
            dominant_priority: false
          caution_surface:
            classes: ["caution_surface"]
            base_cost: 60
            max_cost: 100
            mark_confidence: 153
            samples_to_max_cost: 2
            dominant_priority: false
          high_risk_surface:
            classes: ["high_risk_surface"]
            base_cost: 150
            max_cost: 220
            mark_confidence: 153
            samples_to_max_cost: 2
            dominant_priority: true
          water_or_dropoff:
            classes: ["water_or_dropoff"]
            base_cost: 200
            max_cost: 252
            mark_confidence: 153
            samples_to_max_cost: 2
            dominant_priority: true
