bt_navigator:
  ros__parameters:
    enable_stamped_cmd_vel: true
    global_frame: __MAP_FRAME__
    robot_base_frame: __BASE_FRAME__
    odom_topic: __ODOM_TOPIC__
    bt_loop_duration: 10
    default_server_timeout: 500
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    # Keep a valid global path instead of replacing it at 1 Hz. Replan only when
    # the goal changes or the current path becomes invalid.
    default_nav_to_pose_bt_xml: "__NAV_TO_POSE_BT_XML__"
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code



controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    controller_frequency: 20.0
    # MPPI uses this velocity feedback as the initial state of every rollout.
    # It must be the odometry topic that describes the velocity of base_link.
    odom_topic: __ODOM_TOPIC__
    odom_duration: 0.3
    # MPPI SpeedLimit messages scale angular and linear limits together. Do not publish
    # one during the 0.6 rad/s turn test. To change only forward speed,
    # set FollowPath.vx_max and velocity_smoother.max_velocity[0] together.
    speed_limit_topic: __SPEED_LIMIT_TOPIC__
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    # Fail immediately into BT local-costmap recovery instead of alternating
    # zero commands and short motion bursts while every MPPI rollout collides.
    failure_tolerance: 0.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["position_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 600.0
    position_goal_checker:
      # Ordinary NavigateToPose goals are position tasks. Their quaternion is a
      # placeholder and must not delay success or trigger endpoint motion.
      stateful: false
      plugin: "nav2_controller::PositionGoalChecker"
      xy_goal_tolerance: 1.0
    FollowPath:
      # Use a deterministic, zero-linear-velocity turn only when a changed goal's
      # initial path heading is more than 45 degrees from the robot. Once aligned,
      # the shim hands the entire remaining path to MPPI and does not re-engage for
      # same-goal replans or at the position-only endpoint.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      angular_dist_threshold: 0.785
      angular_disengage_threshold: 0.15
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.6
      max_angular_accel: 1.5
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: false
      rotate_to_heading_once: true
      # The previously tested open-loop ramp reaches the Jackal's rotational
      # breakaway speed instead of repeatedly restarting from near-zero odometry.
      closed_loop: false
      # SmacPlanner2D does not provide kinematically feasible path orientations;
      # derive initial heading from the sampled path geometry instead.
      use_path_orientations: false
      primary_controller: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      # Keep odometry feedback, but let MPPI's first 50 ms command clear the
      # 0.08 m/s downstream teleop dead zone (2.0 * 0.05 = 0.10 m/s).
      # The velocity smoother below still enforces the physical 0.5 m/s^2 ramp.
      open_loop: true
      ax_max: 2.5
      ax_min: -1.0
      ay_max: 3.0
      # Let MPPI's rollouts reach the proven 0.6 rad/s breakaway command even
      # while measured angular velocity is still zero. The velocity smoother
      # remains the physical 1.5 rad/s^2 acceleration limit sent to the robot.
      az_max: 6.0
      az_min: -6.0
      vx_std: 0.2
      vy_std: 0.2
      # Broaden angular samples so MPPI evaluates useful turning trajectories.
      wz_std: 0.4
      vx_max: 1.0
      # Reverse remains bounded and available for tight-space maneuvers. The
      # forward critic still makes forward travel preferable when both are valid.
      vx_min: -0.5
      vy_max: 0.5
      # 0.6 rad/s was verified to overcome stationary turning resistance.
      wz_max: 0.75 #0.6
      iteration_count: 1
      # Prediction horizon = 56 * 0.05 = 2.8 s, or 2.8 m at vx_max.
      prune_distance: 3.5
      transform_tolerance: 0.1
      # A little more averaging reduces cycle-to-cycle winner switching.
      temperature: 0.4
      gamma: 0.015
      motion_model: "DiffDrive"
      # Enable visualization only while debugging; 2000 x 56 trajectories can
      # consume enough CPU/bandwidth to make the control loop less regular.
      visualize: false
      regenerate_noises: false
      # First-order SG filtering is smoother, at the cost of some agility.
      sgf_order: 1
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.2
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "PathAlignCritic", "PathFollowCritic", "PathAngleCritic",
        "PreferForwardCritic", "VelocityDeadbandCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      # jackal_teleop applies a 0.04 Joy-axis dead zone. With the bridge's
      # 0.75 rad/s full-axis calibration, angular commands below 0.03 rad/s are
      # discarded. Retain angular breakaway here, but allow MPPI to choose zero
      # linear speed for a legitimate stationary local maneuver.
      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        cost_weight: 35.0
        # Preserve the angular breakaway incentive, but never penalize zero
        # linear speed: local maneuvering must be allowed to rotate in place
        # without preferring at least 0.09 m/s of translation.
        deadband_velocities: [0.0, 0.0, 0.04]
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81 #3.81
        critical_cost: 300.0 #300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 1 # Try step 2 for reduced CPU load
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0 # Increase this to make MPPI follow the path more closely, 
        offset_from_furthest: 5 # Try move offsets 
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        # Evaluate the closer forward or reverse path direction instead of forcing
        # MPPI to turn forward when reversing is the safer local maneuver.
        cost_weight: 8.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 1


local_costmap:
  local_costmap:
    ros__parameters:
      sensor_frame: __LIDAR_FRAME__
      enable_stamped_cmd_vel: true
      initial_transform_timeout: 20.0
      transform_tolerance: 0.3
      update_frequency: 5.0
      publish_frequency: 2.0
      # Keep the rolling controller costmap in the continuous odometry frame.
      global_frame: __ODOM_FRAME__
      robot_base_frame: __BASE_FRAME__
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.15 #0.25 # Try 0.2 or 0.15 for small obstacle misses and if compute is not a concern
      # footprint: "[ [0.15, 0.15], [0.15, -0.15], [-0.15, -0.15], [-0.15, 0.15] ]"
      footprint: "[ [0.25, 0.25], [0.25, -0.25], [-0.25, -0.25], [-0.25, 0.25] ]"
      # footprint: "[ [0.55, 0.45], [0.55, -0.45], [-0.55, -0.45], [-0.55, 0.45] ]"
      always_send_full_costmap: true
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Keep this larger than the 0.368 m circumscribed footprint radius so
        # MPPI can use the inflation field for efficient footprint checking.
        cost_scaling_factor: 5.0
        inflation_radius: 0.5
      voxel_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_size: 0.15
        publish_voxel_map: false
        # TODO: Probably don't need origin, max and min height here. Check before removing.
        origin_z: -5.0
        max_obstacle_height: 20.0
        min_obstacle_height: -15.0
        mark_threshold: 1
        # Rapidly expire transient/self observations in the controller costmap.
        voxel_decay: 3.0
        decay_model: 0
        update_footprint_enabled: true
        combination_method: 1
        transform_tolerance: 0.5
        mapping_mode: false
        # A 3-D lidar needs separate marking and frustum-clearing sources.
        observation_sources: "pointcloud_mark pointcloud_clear"
        pointcloud_mark:
          topic: __OBSTACLE_TOPIC__
          sensor_frame: __LIDAR_FRAME__
          data_type: "PointCloud2"
          marking: true
          clearing: false
          min_obstacle_height: -15.0
          max_obstacle_height: 20.0
          obstacle_range: 10.0
          observation_persistence: 0.0
          expected_update_rate: 0.0
          clear_after_reading: true
          filter: "voxel"
          voxel_min_points: 2
        pointcloud_clear:
          # Use the full scan for free-space clearing; the filtered cloud may be empty.
          topic: __POINTCLOUD_TOPIC__ 
          sensor_frame: __LIDAR_FRAME__
          data_type: "PointCloud2"
          marking: false
          clearing: true
          min_z: 0.3
          max_z: 10.0
          vertical_fov_angle: 0.75
          vertical_fov_padding: 0.1
          horizontal_fov_angle: 6.283
          decay_acceleration: 1.0
          model_type: 1
          observation_persistence: 0.0
          expected_update_rate: 0.0
          clear_after_reading: true


global_costmap:
  global_costmap:
    ros__parameters:
      # enable_stamped_cmd_vel: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: __MAP_FRAME__
      robot_base_frame: __BASE_FRAME__
      # Match the local collision footprint so the global planner does not
      # create paths that MPPI rejects for the larger local footprint.
      footprint: "[ [0.25, 0.25], [0.25, -0.25], [-0.25, -0.25], [-0.25, 0.25] ]"
      rolling_window: True
      resolution: 0.25

      width: 100          # 20m at 0.06 resolution
      height: 100         # 20m at 0.06 resolution

      track_unknown_space: true
      always_send_full_costmap: true
      plugins: ["voxel_layer", "inflation_layer"]

      voxel_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        publish_voxel_map: false
        voxel_size: 0.25
        origin_z: -5.0
        max_obstacle_height: 20.0
        min_obstacle_height: -15.0
        mark_threshold: 1
        voxel_decay: 5.0
        decay_model: 0
        update_footprint_enabled: true
        combination_method: 1
        transform_tolerance: 0.5
        mapping_mode: false
        observation_sources: "pointcloud_mark pointcloud_clear"
        pointcloud_mark:
          topic: __OBSTACLE_TOPIC__
          sensor_frame: __LIDAR_FRAME__
          data_type: "PointCloud2"
          marking: true
          clearing: false
          min_obstacle_height: -15.0
          max_obstacle_height: 20.0
          obstacle_range: 25.0 # Try 20 to 30 meters instead
          observation_persistence: 0.0
          expected_update_rate: 0.0
          clear_after_reading: true
          filter: "voxel"
          voxel_min_points: 2
        pointcloud_clear:
          # Use the full scan for free-space clearing; the filtered cloud may be empty.
          topic: __POINTCLOUD_TOPIC__ 
          sensor_frame: __LIDAR_FRAME__
          data_type: "PointCloud2"
          marking: false
          clearing: true
          min_z: 0.3
          max_z: 25.0 # same as above try 20 to 30 meters instead
          vertical_fov_angle: 0.75
          vertical_fov_padding: 0.1
          horizontal_fov_angle: 6.283
          decay_acceleration: 0.5 # reduce to 1.0 for slower decay and 0.5 for global map
          model_type: 1
          observation_persistence: 0.0
          expected_update_rate: 0.0
          clear_after_reading: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.1
        inflation_radius: 0.5


map_server:
  ros__parameters:
    use_sim_time: False
    # No yaml_filename parameter - map comes from SLAM

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    # expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      # NavFn repeatedly failed to extract return-leg paths and produced a new
      # controller path every second. Smac 2-D uses cost-aware A* and smooths
      # one stable path through the available corridor.
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.5
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      terminal_checking_interval: 5000
      max_planning_time: 2.0
      # Prefer the middle of available corridors without shrinking clearance.
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true

smoother_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    global_frame: __MAP_FRAME__
    local_frame: __ODOM_FRAME__
    robot_base_frame: __BASE_FRAME__
    transform_tolerance: 0.1
    enable_stamped_cmd_vel: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.2
    rotational_acc_lim: 0.5

waypoint_follower:
  ros__parameters:
    enable_stamped_cmd_vel: true
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: true
    # Interpolate the controller's 20 Hz output into a smoother 50 Hz hardware command.
    smoothing_frequency: 50.0
    # Avoid a tiny angular correction proportionally suppressing forward ramp-up.
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # These bounds must agree with the MPPI model above. The speed_limit topic
    # can impose a lower temporary cap; these remain the absolute safety caps.
    max_velocity: [1.0, 0.0, 0.75]
    # Allow bounded reverse commands from MPPI and Nav2 backup recoveries.
    min_velocity: [-0.5, 0.0, -0.75]
    # TODO: Need to tune these to make sure the Jackal can decelerate fast enough to avoid collisions.
    max_accel: [0.3, 0.0, 1.5]
    max_decel: [-1.0, 0.0, -1.5]
    odom_topic: __ODOM_TOPIC__
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.25 #1.0


# Calibration for the physical Joy-to-platform velocity mapping. Measure the
# steady speed produced by a Joy axis of 1.0 and put that value here. The bridge
# then preserves Nav2 commands in m/s and rad/s instead of applying gain factors.
cmd_vel_to_joy:
  ros__parameters:
    cmd_vel_topic: __SMOOTHED_CMD_VEL_TOPIC__
    # Clearpath Jackal turbo default; replace with your measured full-axis speed.
    linear_speed_at_full_axis: 2.0
    angular_speed_at_full_axis: 0.75


# TODO do we want this?
collision_monitor:
  ros__parameters:
    enable: False
    enable_stamped_cmd_vel: true
    base_frame_id: __BASE_FRAME__
    odom_frame_id: __ODOM_FRAME__
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["pointcloud"]
    pointcloud:
      type: "pointcloud"
      topic: "ouster/points"
      min_height: 0.15
      max_height: 2.0
      enabled: False

docking_server:
  ros__parameters:
    enable: False
    enable_stamped_cmd_vel: true
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: map
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    # Types of docks
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # Dock instances
    # The following example illustrates configuring dock instances.
    docks: ['home_dock']  # Input your docks here
    home_dock:
      type: 'simple_charging_dock'
      frame: map
      pose: [0.0, 0.0, 0.0]

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
